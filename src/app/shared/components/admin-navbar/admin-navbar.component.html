<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <a class="navbar-brand" *ngIf="!isAdminLoggedIn" routerLink="/admin/login">LMS University | Admin</a>
    <a class="navbar-brand" *ngIf="isAdminLoggedIn" routerLink="/admin/dashboard">LMS University | Admin</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarNav" aria-controls="navbarNav"
      aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <!-- Not logged in → show Login & Register -->
        <ng-container *ngIf="!isAdminLoggedIn">
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/login" routerLinkActive="active">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/register" routerLinkActive="active">Register</a>
          </li>
        </ng-container>

        <!-- Logged in → show all admin links -->
        <ng-container *ngIf="isAdminLoggedIn">
          <li class="nav-item">
            <a class="nav-link" routerLink="/student/login" routerLinkActive="active">Student</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/teacher/login" routerLinkActive="active">Teacher</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/enrollment" routerLinkActive="active">Enrollment</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/courses" routerLinkActive="active">Courses</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/reports" routerLinkActive="active">Reports</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/system-settings" routerLinkActive="active">System Settings</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/users" routerLinkActive="active">Users</a>
          </li>
          <li class="nav-item">
            <button class="btn btn-link nav-link" style="color: red;" (click)="logout()">Logout</button>
          </li>
        </ng-container>

      </ul>
    </div>
  </div>
</nav>
