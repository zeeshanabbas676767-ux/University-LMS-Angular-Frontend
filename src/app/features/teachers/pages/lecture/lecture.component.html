
<style>
  label {
  color: white;
}
</style>

<h3 style="text-align:center; color:white;">Lecture</h3>

  <!-- Add / Edit Form -->
  <div class="card p-3 mb-4" style="background-color: black;">
    <!-- <h5>{{ isEditMode ? 'Edit Course' : 'Add Course' }}</h5> -->

    <div class="row">

      <div class="col-md-4">
        <label>Lecture Title</label>
        <input type="text" class="form-control" [(ngModel)]="formLecture.title">
      </div>

      <div class="col-md-4">
        <label>Video URL</label>
        <input type="text" class="form-control" [(ngModel)]="formLecture.videoUrl">
      </div>
  <!-- <div class="col-md-4">
        <label>Course ID</label>
        <input type="text" class="form-control" [(ngModel)]="formLecture.courseId">
      </div> -->

        <div class="col-md-4">
        <label>Course</label>
         <select class="form-control" [(ngModel)]="selectedCourseId"> 
          <option value="">Select Course</option>
          <option *ngFor="let s of course" [value]="s.id">
            {{ s.title  }} 
          </option> 
        </select>
      </div>

    </div>

    <div class="mt-3">
      <button class = "btn btn-outline-primary me-2" style = "color:white;font-weight:600" (click)="saveLecture()">
        {{ isEditMode ? 'Update' : 'Add' }}
      </button>

      <button class = "btn btn-outline-secondary" style = "color:white;font-weight:600"  *ngIf="isEditMode" (click)="resetForm()">
        Cancel
      </button>
    </div>
  </div> 


  <div class="container-fluid mt-5" style="overflow:auto; max-width: 100%; ">

    <table class="table table-dark">
      <thead>
        <tr>
          <th>Title</th>
          <th>Video URL</th>  
          <th>Course</th>
          <th>Action</th>
        </tr>
      </thead>  

      <tbody>
        <tr *ngFor="let c of Lecture">
          <td>{{ c.title }}</td>
          <td> <a [href]="c.videoUrl" target="_blank">{{ c.videoUrl }}</a></td>
            <td>{{ c.course?.title }}</td>
              <td>
             <div class="action-buttons">
            <button class="btn btn-primary btn-sm me-2 edit"  (click)="editLecture(c)">
            <i class="fa fa-edit" style="transform:scale(1.2);"></i>    Edit
            </button>

            <button class="btn btn-danger btn-sm delete" (click)="deleteLecture(c.id)">
            <i class="fa fa-trash" style="transform:scale(1.2);"></i>   Delete
            </button>
            </div>
          </td>
        </tr>
      </tbody>

    </table>
  </div>
