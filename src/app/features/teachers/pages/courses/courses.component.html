
<h3 style="text-align:center; color:white;">Courses</h3>
  <!-- Course List -->
  <div class="container-fluid mt-5" style="overflow:auto; max-width: 100%; ">

    <table class="table table-dark">
      <thead>
        <tr>
          <th>Title</th>
          <th>Description</th>  
        </tr>
      </thead>  

      <tbody>
        <tr *ngFor="let c of courses">
          <td>{{ c.title }}</td>
          <td>{{ c.description }}</td>
        </tr>
      </tbody>

    </table>
  </div>
